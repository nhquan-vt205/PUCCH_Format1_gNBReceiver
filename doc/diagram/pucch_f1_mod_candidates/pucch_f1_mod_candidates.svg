<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1126" viewBox="0 0 980 1126"
     font-family="Calibri, Arial, sans-serif" font-size="13">
  <!-- module : pucch_f1_mod_candidates -->
  <!-- stage  : 2 - diagram L2 (full gate level) -->
  <!-- source : doc/spec/architecture/pucch_f1_mod_candidates_spec.md -->
  <desc id="model"><![CDATA[
// clk rising edge; rst_n synchronous active-low. Nets with the same label are connected.
// Flattened arrays: entry k of cand_i/cand_q/cand_phase = [16k+15:16k], of cand_bits = [2k+1:2k].
// 23170 = 16'h5A82, -23170 = 16'hA57E (signed F15).
cand_valid = cand_valid_q;
cand_m_bit = m_bit_q;
[mux_mbit]
m_bit_d = txn_start ? m_bit : m_bit_q;
[reg_mbit]
m_bit_q <= m_bit_d @(rst=2'd0);
[gate_hs]
tbl_hs = cand_valid_q & cand_ready;
[mux_cvhs]
cv_hold = tbl_hs ? 1'b0 : cand_valid_q;               // one table transfer per transaction
[mux_cvst]
cv_set = txn_start ? 1'b1 : cv_hold;
[mux_cvclr]
cand_valid_d = txn_clr ? 1'b0 : cv_set;                // txn_clr has priority
[reg_cv]
cand_valid_q <= cand_valid_d @(rst=1'b0);
[op_isq]
is_qpsk = (m_bit_q == 2'd2);                          // else M_bit = 1 table
[mux_mask]
cand_mask  = is_qpsk ? 4'b1111 : 4'b0011;
[mux_ci]
cand_i     = is_qpsk ? 64'hA57E_A57E_5A82_5A82 : 64'h0000_0000_A57E_5A82;
[mux_cq]
cand_q     = is_qpsk ? 64'hA57E_5A82_A57E_5A82 : 64'h0000_0000_A57E_5A82;
[mux_ph]
cand_phase = is_qpsk ? 64'hA000_6000_E000_2000 : 64'h0000_0000_A000_2000;
[mux_bits]
cand_bits  = is_qpsk ? 8'b11_01_10_00 : 8'b00_00_01_00;  // packed {b1,b0} per k, not binary k
]]></desc>
