<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="861" viewBox="0 0 1840 861"
     font-family="Calibri, Arial, sans-serif" font-size="13">
  <!-- module : pucch_f1_normalize -->
  <!-- stage  : 2 - diagram L1 (gate level + approved blk_gain, blk_div, blk_round, cloud_next; level raised from L2: 2 multipliers 26x31 + 2 sequential dividers) -->
  <!-- source : doc/spec/architecture/pucch_f1_normalize_spec.md -->
  <desc id="model"><![CDATA[
// clk rising edge; rst_n synchronous active-low: every register resets to 0. Nets with the same label are connected.
// RNE_div(P, D), D > 0: a = |P|, v = a / D, r = a % D; v += (2r > D) | (2r == D & v[0]); result -v if P < 0.
localparam ST_IDLE = 2'd0, ST_DIV = 2'd1, ST_ROUND = 2'd2, ST_OUT = 2'd3;
d_valid = d_valid_q;
d_i     = d_i_q;
d_q     = d_q_q;
sat_err = sat_err_q;
[blk_gain]
// per lane L in {i, q}: S = s_L (signed26 F15)
p_L     = $signed(s_L) * $signed({1'b0, 30'd652032874});      // KINV_Q30, signed57 full precision
pa_L    = |p_L|;  v_L = pa_L >> 30;  r_L = pa_L[29:0];
zv_L    = v_L + ((r_L > 30'h2000_0000) | ((r_L == 30'h2000_0000) & v_L[0]));
z_neg_L = p_L[56];                                            // sign of Z (Z = 0 -> magnitude 0)
z_ovf_L = z_neg_L ? (zv_L > 2**25) : (zv_L > 2**25 - 1);      // Z outside signed26
z_abs_L = zv_L[25:0];                                         // |Z|
z_sat   = z_ovf_i | z_ovf_q;
[cloud_next]
st_idle = (state_q == ST_IDLE); st_div = (state_q == ST_DIV); st_round = (state_q == ST_ROUND); st_out = (state_q == ST_OUT);
cnt_last = (cnt_q == 5'd25);
load     = st_idle & start & ~z_sat & ~clr;
step     = st_div & ~clr;
rnd_ok   = st_round & ~d_sat & ~clr;
state_d  = clr ? ST_IDLE :
           st_idle  ? ((start & ~z_sat) ? ST_DIV : ST_IDLE) :
           st_div   ? (cnt_last ? ST_ROUND : ST_DIV) :
           st_round ? (d_sat ? ST_IDLE : ST_OUT) :
           st_out   ? (d_ready ? ST_IDLE : ST_OUT) : ST_IDLE;
d_valid_d = clr ? 1'b0 : rnd_ok ? 1'b1 : (st_out & d_ready) ? 1'b0 : d_valid_q;
sat_err_d = ~clr & ((st_idle & start & z_sat) | (st_round & d_sat));
[fsm_state]
state_q <= state_d @(rst=ST_IDLE);
[op_cinc]
cnt_inc = cnt_q + 5'd1;
[mux_cstep]
cnt_run = st_div ? cnt_inc : cnt_q;
[mux_cload]
cnt_d = load ? 5'd0 : cnt_run;
[reg_cnt]
cnt_q <= cnt_d @(rst=5'd0);                                     // divider iteration 0..25
[blk_div]
// two restoring dividers in parallel, 1 quotient bit per clock, MSB first
on load: a_L_q <= z_abs_L; z_neg_L_q <= z_neg_L; rem_L_q <= 8'd0; quo_L_q <= 26'd0;
on step: rs_L = {rem_L_q[6:0], a_L_q[25]};                  // 8 bits, < 2 * n_re
         ge_L = (rs_L >= {1'b0, n_re});
         rem_L_q <= ge_L ? rs_L - {1'b0, n_re} : rs_L;
         quo_L_q <= {quo_L_q[24:0], ge_L};  a_L_q <= {a_L_q[24:0], 1'b0};
registers a_L_q[25:0], rem_L_q[7:0], quo_L_q[25:0], z_neg_L_q @(rst=0)
[blk_round]
inc_L   = ({rem_L_q, 1'b0} > {2'b0, n_re}) | (({rem_L_q, 1'b0} == {2'b0, n_re}) & quo_L_q[0]);
dv_L    = {1'b0, quo_L_q} + inc_L;                            // 27 bits
dsat_L  = z_neg_L_q ? (dv_L > 2**25) : (dv_L > 2**25 - 1);
d_new_L = z_neg_L_q ? -dv_L[25:0] : dv_L[25:0];               // signed26 F15
d_sat   = dsat_i | dsat_q;
[mux_dout]
d_out_d = rnd_ok ? {d_new_i, d_new_q} : {d_i_q, d_q_q};
[reg_dout]
{d_i_q, d_q_q} <= d_out_d @(rst=52'd0);
[reg_dv]
d_valid_q <= d_valid_d @(rst=1'b0);                            // held until d_ready
[reg_se]
sat_err_q <= sat_err_d @(rst=1'b0);                            // 1-clock pulse
]]></desc>
