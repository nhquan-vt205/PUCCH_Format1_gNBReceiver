<svg xmlns="http://www.w3.org/2000/svg" width="2470" height="1391" viewBox="0 0 2470 1391"
     font-family="Calibri, Arial, sans-serif" font-size="13">
  <!-- module : pucch_f1_scalar_mle -->
  <!-- stage  : 2 - diagram L1 (gate level + approved blk_metric, blk_rank; level raised from L2: 8 multipliers + 4-way ranking) -->
  <!-- source : doc/spec/architecture/pucch_f1_scalar_mle_spec.md -->
  <desc id="model"><![CDATA[
// clk rising edge; rst_n synchronous active-low: every register resets to 0. Nets with the same label are connected.
// Flattened table: entry k of ci_q/cq_q = [16k+15:16k] (signed F15), of bits_q = [2k+1:2k].
cand_ready = ~tbl_valid_q;
tbl_valid  = tbl_valid_q;
cand_err   = cand_err_q;
mle_valid  = mle_valid_q;
[gate_cr]
cand_ready = ~tbl_valid_q;
[gate_tld]
tbl_load = cand_valid & cand_ready;
[bus_tin]
tbl_in = {cand_mask, cand_i, cand_q, cand_bits};                 // 4 + 64 + 64 + 8 = 140 bits
[mux_tbl]
tbl_d = tbl_load ? tbl_in : {mask_q, ci_q, cq_q, bits_q};
[reg_tbl]
{mask_q, ci_q, cq_q, bits_q} <= tbl_d @(rst=140'd0);            // captured candidate table
[mux_tvset]
tv_set = tbl_load ? 1'b1 : tbl_valid_q;
[mux_tvclr]
tbl_valid_d = txn_clr ? 1'b0 : tv_set;
[reg_tv]
tbl_valid_q <= tbl_valid_d @(rst=1'b0);
[op_mbne]
mbit_ne = (cand_m_bit != m_bit);
[gate_ce]
cand_err_d = tbl_load & mbit_ne & ~txn_clr;
[reg_ce]
cand_err_q <= cand_err_d @(rst=1'b0);                           // 1-clock pulse after table capture
[gate_dr]
d_ready = tbl_valid_q & ~d_held_q & ~mle_valid_q;
[gate_dld]
d_load = d_valid & d_ready;
[mux_d]
d_d = d_load ? {d_i, d_q} : {di_q, dq_q};
[reg_d]
{di_q, dq_q} <= d_d @(rst=52'd0);                                // captured scalar d_rx
[mux_dhset]
dh_set = d_load ? 1'b1 : d_held_q;
[mux_dhclr]
d_held_d = txn_clr ? 1'b0 : dh_set;
[reg_dh]
d_held_q <= d_held_d @(rst=1'b0);
[gate_det]
det = d_held_q & ~mle_valid_q;                                   // detect: clock after scalar capture
[mux_mvset]
mv_set = det ? 1'b1 : mle_valid_q;
[mux_mvclr]
mle_valid_d = txn_clr ? 1'b0 : mv_set;
[reg_mv]
mle_valid_q <= mle_valid_d @(rst=1'b0);                         // held until txn_clr
[blk_metric]
// exact signed metrics, F30: products signed42 (26 x 16), sum signed43; no rounding
for (k = 0; k < 4; k = k + 1)
  metric[43*k +: 43] = $signed(di_q) * $signed(ci_q[16*k +: 16]) + $signed(dq_q) * $signed(cq_q[16*k +: 16]);
[blk_rank]
// rank by (metric descending, k ascending) over active entries mask_q[k]; signed compare only
k_best = 0; found = 0;
for (k = 0; k < 4; k = k + 1)
  if (mask_q[k] && (!found || $signed(M[k]) > $signed(M[k_best]))) begin k_best = k; found = 1; end
k_second = 0; found = 0;
for (k = 0; k < 4; k = k + 1)
  if (mask_q[k] && k != k_best && (!found || $signed(M[k]) > $signed(M[k_second]))) begin k_second = k; found = 1; end
best_m   = M[k_best];  second_m = M[k_second];
gap_m    = {best_m[42], best_m} - {second_m[42], second_m};      // 44-bit, >= 0
bits_best = bits_q[2*k_best +: 2];
res_new  = {k_best, bits_best, di_q, dq_q, best_m, second_m, gap_m};
[mux_res]
res_det = det ? res_new : res_q;
[mux_resclr]
res_d = txn_clr ? 186'd0 : res_det;
[reg_res]
res_q <= res_d @(rst=186'd0);
// res_q = {mle_candidate_idx[1:0], mle_uci_bits[1:0], mle_d_rx_i[25:0], mle_d_rx_q[25:0],
//          mle_metric_best[42:0], mle_metric_second[42:0], mle_metric_gap[43:0]}
[bus_rsp]
{mle_candidate_idx, mle_uci_bits, mle_d_rx_i, mle_d_rx_q, mle_metric_best, mle_metric_second, mle_metric_gap} = res_q;
]]></desc>
