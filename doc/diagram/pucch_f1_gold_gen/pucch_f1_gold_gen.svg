<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1354" viewBox="0 0 1120 1354"
     font-family="Calibri, Arial, sans-serif" font-size="13">
  <!-- module : pucch_f1_gold_gen -->
  <!-- stage  : 2 - diagram L2 (full gate level) -->
  <!-- source : doc/spec/architecture/pucch_f1_gold_gen_spec.md -->
  <desc id="model"><![CDATA[
// clk rising edge; rst_n synchronous active-low: every register below resets to 0.
// Nets drawn as short labelled stubs with the same name are connected.
c_bit   = x1_q[0] ^ x2_q[0];
c_idx   = c_idx_q;
[gate_x1fb]
x1_fb = x1_q[3] ^ x1_q[0];
[bus_x1sh]
x1_sh = {x1_fb, x1_q[30:1]};                     // shift right by one, new bit 30
[mux_x1run]
x1_run = run_q ? x1_sh : x1_q;
[mux_x1st]
x1_d = start ? 31'd1 : x1_run;                   // x1(0) = 1, x1(1..30) = 0
[reg_x1]
x1_q <= x1_d @(rst=31'd0);                       // bit k = x1(t+k)
[gate_x2fb]
x2_fb = x2_q[3] ^ x2_q[2] ^ x2_q[1] ^ x2_q[0];
[bus_x2sh]
x2_sh = {x2_fb, x2_q[30:1]};
[mux_x2run]
x2_run = run_q ? x2_sh : x2_q;
[mux_x2st]
x2_d = start ? c_init : x2_run;
[reg_x2]
x2_q <= x2_d @(rst=31'd0);
[op_winc]
warm_inc = warm_cnt_q + 11'd1;
[mux_wen]
warm_run = warm_en ? warm_inc : warm_cnt_q;
[mux_wst]
warm_cnt_d = start ? 11'd0 : warm_run;
[reg_warm]
warm_cnt_q <= warm_cnt_d @(rst=11'd0);             // warm-up shifts done
[op_wdone]
warm_done = (warm_cnt_q == 11'd1599);             // this shift is the 1600th
[op_iinc]
idx_inc = c_idx_q + 12'd1;
[mux_ien]
idx_run = c_valid ? idx_inc : c_idx_q;
[mux_ist]
c_idx_d = start ? 12'd0 : idx_run;
[reg_idx]
c_idx_q <= c_idx_d @(rst=12'd0);
[op_ilast]
idx_last = (c_idx_q == 12'd4095);
[gate_wen]
warm_en = run_q & ~out_q;
[gate_cv]
c_valid = run_q & out_q;
[gate_set]
set_out = warm_en & warm_done;
[gate_stop]
stop = c_valid & idx_last;
[gate_ohold]
out_hold = out_q | set_out;
[gate_okeep]
out_keep = ~(clr | start | stop);                // clr has priority over start
[gate_outd]
out_d = out_hold & out_keep;
[reg_out]
out_q <= out_d @(rst=1'b0);                       // output phase
[gate_rkeep]
run_keep = run_q & ~stop;
[gate_rset]
run_set = start | run_keep;
[gate_rund]
run_d = run_set & ~clr;
[reg_run]
run_q <= run_d @(rst=1'b0);                       // running
[gate_cbit]
c_bit = x1_q[0] ^ x2_q[0];
]]></desc>
