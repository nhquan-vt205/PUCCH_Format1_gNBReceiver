<svg xmlns="http://www.w3.org/2000/svg" width="2590" height="810" viewBox="0 0 2590 810"
     font-family="Calibri, Arial, sans-serif" font-size="13">
  <!-- module : pucch_f1_rx_inverse -->
  <!-- stage  : 2 - diagram L1 (u_ children + approved blk_occ, blk_acc; OCC ROM as mem_occ; join register gate level) -->
  <!-- source : doc/spec/architecture/pucch_f1_rx_inverse_spec.md + child ports (pucch_f1_cordic, pucch_f1_normalize) -->
  <desc id="model"><![CDATA[
// clk rising edge; rst_n synchronous active-low: valids, pulses, join register and accumulator reset to 0.
// Nets with the same label are connected. txn_clr has priority over capture / accumulate.
d_n_re = n_re;
[blk_occ]
n_sel   = phase_hop ? n_sf1 : n_sf0;                        // N_SF of the current hop
occ_off = (n_sel == 3'd1) ? 8'd0 : (n_sel == 3'd2) ? 8'd1 : (n_sel == 3'd3) ? 8'd5 : (n_sel == 3'd4) ? 8'd14 :
          (n_sel == 3'd5) ? 8'd30 : (n_sel == 3'd6) ? 8'd55 : (n_sel == 3'd7) ? 8'd91 : 8'd0;
occ_addr = occ_off + occ_i * n_sel + phase_m;                // 8 bits, legal 0..139
occ_err  = (n_sel == 3'd0) | (occ_i >= n_sel) | (phase_m >= n_sel);   // combinational, sampled by ctrl at join_fire
[mem_occ]
// constant ROM 140 x 16, OCC[addr] = floor(65536 * rho / N) (source 07 section 3, N = 4 Walsh rows)
occ_phase = occ_err ? 16'd0 : OCC[occ_addr];
[op_padd]
tot_phase = r_phase + occ_phase;                             // forward base + CS + OCC, modulo 65536
[op_neg]
rm_phase = -tot_phase;                                       // negate the total once, modulo 65536
[bus_jin]
j_in = {y_i, y_q, rm_phase, phase_sample_q, phase_first, phase_last};          // 57 bits
[mux_join]
j_d = join_fire ? j_in : {j_i_q, j_q_q, j_phase_q, j_sample_q_q, j_first_q, j_last_q};
[reg_join]
{j_i_q, j_q_q, j_phase_q, j_sample_q_q, j_first_q, j_last_q} <= j_d @(rst=57'd0);
[bus_jsp]
{j_i_q, j_q_q, j_phase_q, j_sample_q_q, j_first_q, j_last_q} = j_data_q;
[gate_jv]
j_valid_d = join_fire & ~txn_clr;
[reg_jv]
j_valid_q <= j_valid_d @(rst=1'b0);
[u_cordic]
pucch_f1_cordic u_cordic (.clr(txn_clr), .in_valid(j_valid_q), .in_i(j_i_q), .in_q(j_q_q), .in_phase(j_phase_q),
  .in_sample_q(j_sample_q_q), .in_first(j_first_q), .in_last(j_last_q), .out_valid(c_valid), .out_i(c_i), .out_q(c_q),
  .out_sample_q(c_sample_q), .out_first(c_first), .out_last(c_last), .ovf_err(c_ovf_err));
[blk_acc]
x_i = {{8{c_i[17]}}, c_i};  x_q = {{8{c_q[17]}}, c_q};                      // sign-extend to 26
sum_i = c_first ? {x_i[25], x_i} : {s_i_q[25], s_i_q} + {x_i[25], x_i};       // 27 bits; same for q
ovf   = (sum_i[26] != sum_i[25]) | (sum_q[26] != sum_q[25]);                   // outside signed26
s_i_q <= txn_clr ? 26'd0 : c_valid ? sum_i[25:0] : s_i_q @(rst=26'd0);   s_q_q likewise
acc_ovf_q  <= ~txn_clr & c_valid & ovf @(rst=1'b0);
acc_done_q <= ~txn_clr & c_valid & c_last & ~ovf @(rst=1'b0);              // S already includes the last sample
acc_done = acc_done_q;
[u_normalize]
pucch_f1_normalize u_normalize (.clr(txn_clr), .start(acc_done_q), .s_i(s_i_q), .s_q(s_q_q), .n_re(n_re),
  .d_valid(d_valid), .d_ready(d_ready), .d_i(d_i), .d_q(d_q), .sat_err(n_sat_err));
[gate_num]
num_err = c_ovf_err | acc_ovf_q | n_sat_err;
]]></desc>
